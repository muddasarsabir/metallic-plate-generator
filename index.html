<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editable Metallic Plate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <style>
        body {
            background-color: #f4f4f5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 40px;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: auto;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .plate-wrapper {
            filter: drop-shadow(15px 15px 25px rgba(0, 0, 0, 0.25))
                    drop-shadow(2px 2px 5px rgba(0, 0, 0, 0.1));
            width: fit-content;
            padding: 30px; /* Safe margin so the drop shadows don't get cropped */
            box-sizing: border-box;
        }

        .plate {
            /* Allows the plate to expand horizontally to completely fit the longest line of code */
            width: fit-content;
            min-width: 500px;
            height: auto;
            background-color: #d4d4d8;
            
            /* Clean, fixed diagonal cut corners */
            clip-path: polygon(
                0 0, 
                calc(100% - 60px) 0, 
                100% 60px, 
                100% 100%, 
                60px 100%, 
                0 calc(100% - 60px)
            );
            
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            /* Fixed padding prevents layout blow-up on extremely long lines */
            padding: 60px 80px;
            box-sizing: border-box;
        }

        .text-container {
            position: relative;
            z-index: 10;
            width: 100%;
        }

        .editable-text {
            font-size: 16px;
            color: #000000; /* Pure black text */
            line-height: 1.6;
            outline: none;
            /* Keeps code exactly on one line unless Enter is manually pressed */
            white-space: pre;
            letter-spacing: -0.3px;
            width: 100%;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }

        .download-btn {
            background-color: #111;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .download-btn:hover {
            background-color: #333;
            transform: translateY(-2px);
        }

        .download-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="plate-wrapper">
        <div class="plate">
            <div class="text-container">
                <div class="editable-text" contenteditable="true" spellcheck="false">Past Your Text</div>
            </div>
        </div>
    </div>

    <button class="download-btn" onclick="downloadPlate()" title="Download as PNG">
        <svg viewBox="0 0 24 24">
            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
        </svg>
        Download Image
    </button>

    <script>
        function downloadPlate() {
            const plateWrapper = document.querySelector('.plate-wrapper');
            
            // Measure the actual scrollable boundaries of the element
            const width = plateWrapper.scrollWidth;
            const height = plateWrapper.scrollHeight;
            
            htmlToImage.toPng(plateWrapper, {
                width: width,
                height: height,
                pixelRatio: 3, // Premium high-res snapshot
                style: {
                    transform: 'none',
                    margin: '0',
                    left: '0',
                    top: '0',
                    width: width + 'px',
                    height: height + 'px',
                    maxWidth: 'none',
                    minWidth: 'none'
                }
            }).then(dataUrl => {
                const link = document.createElement('a');
                link.download = 'metallic-plate.png';
                link.href = dataUrl;
                link.click();
            }).catch(error => {
                console.error("Error generating image:", error);
            });
        }
    </script>
</body>
</html>
